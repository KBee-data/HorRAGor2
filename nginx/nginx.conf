events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Optimization
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Upstream services inside Docker bridge network (horragor-net)
    upstream backend_service {
        server backend:8000;
    }

    upstream frontend_service {
        server frontend:8501;
    }

    # 1. HTTP Server — Automatic 301 Permanent Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name localhost 127.0.0.1;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server — TLS Termination & Reverse Proxy
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost 127.0.0.1;

        # TLS Certificates
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # SSL Protocol and Cipher Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Common Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # --- FastAPI Backend Routes ---
        location /auth/ {
            proxy_pass http://backend_service/auth/;
            proxy_read_timeout 300s;
        }

        location /chat {
            proxy_pass http://backend_service/chat;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://backend_service/health;
        }

        location /docs {
            proxy_pass http://backend_service/docs;
        }

        location /openapi.json {
            proxy_pass http://backend_service/openapi.json;
        }

        location /redoc {
            proxy_pass http://backend_service/redoc;
        }

        # --- Streamlit Frontend Routes & WebSocket Streaming ---
        location /_stcore/stream {
            proxy_pass http://frontend_service/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location /_stcore/ {
            proxy_pass http://frontend_service/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /stream {
            proxy_pass http://frontend_service/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass http://frontend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
