[project]
name = "horragor2"
version = "0.1.0"
description = "Agent conversationnel RAG (LangGraph ReAct) sur une base de films d'horreur — API FastAPI + UI Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "faiss-cpu>=1.14.2",
    "numpy>=2.4.6",
    "sqlalchemy>=2.0.50",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.4.2",
    "langgraph>=1.2.4",
    "langchain-ollama>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
horragor-api = "backend.api.main:run"
horragor-ingest = "backend.data.ingest:main"
horragor-faiss = "backend.data.build_faiss:main"
horragor-search = "backend.data.search_faiss:main"
horragor-pgvector-setup = "backend.data.setup_pgvector:main"
horragor-embeddings = "backend.data.build_embeddings:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Rend `src/` racine d'import : src/front -> import front, src/backend -> import backend.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
